<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña - Escuela de Misterios</title>
    <style>
        body { background: #0a0e1a; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: rgba(20, 25, 40, 0.95); padding: 2rem; border-radius: 1.5rem; width: 350px; text-align: center; border: 1px solid #dbb86b; }
        input { width: 100%; padding: 0.6rem; margin: 0.5rem 0; background: #1e2230; border: 1px solid #4a4f6a; border-radius: 0.8rem; color: #eef; }
        button { background: #8b6b4d; color: white; border: none; padding: 0.6rem; border-radius: 2rem; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #a57c5a; }
        .mensaje { margin-top: 1rem; color: #ffaa88; }
        a { color: #dbb86b; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <h2>🔐 Cambiar contraseña</h2>
    <form id="passwordForm">
        <input type="password" id="old_password" placeholder="Contraseña actual" required>
        <input type="password" id="new_password" placeholder="Nueva contraseña" required>
        <input type="password" id="confirm_password" placeholder="Confirmar nueva contraseña" required>
        <button type="submit">Actualizar</button>
    </form>
    <p class="mensaje" id="mensaje"></p>
    <p><a href="/admin/panel">← Volver al panel</a></p>
</div>
<script>
    document.getElementById('passwordForm').onsubmit = async (e) => {
        e.preventDefault();
        const new_pass = document.getElementById('new_password').value;
        const confirm_pass = document.getElementById('confirm_password').value;
        if (new_pass !== confirm_pass) {
            document.getElementById('mensaje').innerText = '❌ Las contraseñas nuevas no coinciden';
            return;
        }
        const res = await fetch('/cambiar_password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                old_password: document.getElementById('old_password').value,
                new_password: new_pass
            })
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById('mensaje').innerText = '✅ ' + data.mensaje;
            setTimeout(() => { window.location.href = '/admin/panel'; }, 2000);
        } else {
            document.getElementById('mensaje').innerText = '❌ ' + (data.error || 'Error al cambiar la contraseña');
        }
    };
</script>
</body>
</html>
